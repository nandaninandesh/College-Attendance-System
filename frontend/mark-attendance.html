
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mark Attendance</title>

    <link rel="stylesheet" href="css/mark-attendance.css">
</head>

<body>

    <header>
        <h1>Mark Student Attendance</h1>
        <p>College Attendance Management System</p>
    </header>

    <main>

        <h2>Attendance Management Panel</h2>

        <!-- Attendance Details -->
        <section class="form-container">

            <h3>Select Attendance Details</h3>

            <form id="attendanceForm">

                <label for="subject">Select Subject</label>
                <select id="subject" required>
                    <option value="">Select Subject</option>
                    <option value="Mathematics">Mathematics</option>
                    <option value="Physics">Physics</option>
                    <option value="Computer Organization">Computer Organization</option>
                    <option value="Web Technology">Web Technology</option>
                </select>

                <label for="semester">Select Semester</label>
                <select id="semester" required>
                    <option value="">Select Semester</option>
                    <option value="1">Semester 1</option>
                    <option value="2">Semester 2</option>
                    <option value="3">Semester 3</option>
                    <option value="4">Semester 4</option>
                    <option value="5">Semester 5</option>
                    <option value="6">Semester 6</option>
                    <option value="7">Semester 7</option>
                    <option value="8">Semester 8</option>
                </select>

                <label for="attendanceDate">Attendance Date</label>
                <input type="date" id="attendanceDate" required>

                <button type="submit">Load Students</button>

            </form>

        </section>

        <!-- Student Attendance Table -->
        <section class="table-container">

            <h3>Mark Student Attendance</h3>

            <form id="markAttendanceForm">

                <table>

                    <thead>
                        <tr>
                            <th>Student ID</th>
                            <th>Student Name</th>
                            <th>Attendance Status</th>
                        </tr>
                    </thead>

                    <tbody id="attendanceTableBody">
                        <!-- Students will appear here -->
                    </tbody>

                </table>

                <button type="submit" id="submitAttendance">
                    Submit Attendance
                </button>

            </form>

        </section>

    </main>
<script src="js/mark-attendance.js"></script>
</body>
</html>
