
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student List</title>

    <link rel="stylesheet" href="css/student-list.css">
</head>

<body>

    <header>
        <h1>Student List</h1>
        <p>College Attendance Management System</p>
    </header>

    <main>

        <h2>Students Under My Subjects</h2>

        <!-- Student Filters -->
        <section class="filter-container">

            <h3>Filter Students</h3>

            <form id="studentFilterForm">

                <label for="department">Department</label>
                <select id="department">
                    <option value="">All Departments</option>
                    <option value="CSE">CSE</option>
                    <option value="ECE">ECE</option>
                    <option value="ME">Mechanical</option>
                    <option value="CE">Civil</option>
                </select>

                <label for="semester">Semester</label>
                <select id="semester">
                    <option value="">All Semesters</option>
                    <option value="1">Semester 1</option>
                    <option value="2">Semester 2</option>
                    <option value="3">Semester 3</option>
                    <option value="4">Semester 4</option>
                    <option value="5">Semester 5</option>
                    <option value="6">Semester 6</option>
                    <option value="7">Semester 7</option>
                    <option value="8">Semester 8</option>
                </select>

                <button type="submit">Apply Filter</button>

            </form>

        </section>

        <!-- Student Table -->
        <section class="table-container">

            <h3>Student Details</h3>

            <table>

                <thead>
                    <tr>
                        <th>Student ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Department</th>
                        <th>Semester</th>
                    </tr>
                </thead>

                <tbody id="studentTableBody">
                    <!-- Student records will appear here -->
                </tbody>

            </table>

            <p id="studentCount">Total Students: 0</p>

        </section>

    </main>
<script src="js/student-list.js"></script>
</body>
</html>
