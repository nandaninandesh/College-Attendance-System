
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Students</title>

    <link rel="stylesheet" href="css/manage-students.css">
</head>

<body>

    <header>
        <h1>Manage Students</h1>
        <p>College Attendance Management System</p>
    </header>

    <main>

        <h2>Student Management Panel</h2>

        <!-- Add Student Form -->

        <section class="form-container">

            <h3>Add New Student</h3>

            <form id="studentForm">

                <label for="studentId">Student ID</label>
                <input type="text" id="studentId"
                    placeholder="Enter student ID" required>

                <label for="studentName">Student Name</label>
                <input type="text" id="studentName"
                    placeholder="Enter student name" required>

                <label for="studentEmail">Email Address</label>
                <input type="email" id="studentEmail"
                    placeholder="Enter email address" required>

                <label for="studentBranch">Branch</label>
                <input type="text" id="studentBranch"
                    placeholder="Enter branch" required>

                <label for="studentSemester">Semester</label>
                <select id="studentSemester" required>
                    <option value="">Select Semester</option>
                    <option value="1">Semester 1</option>
                    <option value="2">Semester 2</option>
                    <option value="3">Semester 3</option>
                    <option value="4">Semester 4</option>
                    <option value="5">Semester 5</option>
                    <option value="6">Semester 6</option>
                    <option value="7">Semester 7</option>
                    <option value="8">Semester 8</option>
                </select>

                <button type="submit">Add Student</button>

            </form>

        </section>

        <!-- Student List -->

        <section class="table-container">

            <h3>Student List</h3>

            <table>
                <thead>
                    <tr>
                        <th>Student ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Branch</th>
                        <th>Semester</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="studentTableBody">
                    <!-- Student records will appear here -->
                </tbody>

            </table>

        </section>

    </main>
<script src="js/manage-students.js"></script>
</body>
</html>
