
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Attendance Reports</title>
    <link rel="stylesheet" href="css/teacher-reports.css">
</head>
<body>

    <div class="container">
        <h1>Attendance Reports</h1>
        <p>View subject-wise student attendance reports</p>

        <form id="reportForm">

            <label for="subject">Select Subject</label>
            <select id="subject" required>
                <option value="">Choose Subject</option>
                <option value="Mathematics">Mathematics</option>
                <option value="Physics">Physics</option>
                <option value="Computer Organization">Computer Organization</option>
                <option value="Web Technology">Web Technology</option>
            </select>

            <label for="semester">Select Semester</label>
            <select id="semester" required>
                <option value="">Choose Semester</option>
                <option value="1">Semester 1</option>
                <option value="2">Semester 2</option>
                <option value="3">Semester 3</option>
                <option value="4">Semester 4</option>
                <option value="5">Semester 5</option>
                <option value="6">Semester 6</option>
                <option value="7">Semester 7</option>
                <option value="8">Semester 8</option>
            </select>

            <label for="fromDate">From Date</label>
            <input type="date" id="fromDate" required>

            <label for="toDate">To Date</label>
            <input type="date" id="toDate" required>

            <button type="submit">Generate Report</button>
        </form>

        <div class="summary">
            <div class="card">
                <h3>Total Records</h3>
                <p id="totalRecords">0</p>
            </div>

            <div class="card">
                <h3>Present</h3>
                <p id="presentCount">0</p>
            </div>

            <div class="card">
                <h3>Absent</h3>
                <p id="absentCount">0</p>
            </div>
        </div>

        <h2>Attendance Details</h2>

        <table>
            <thead>
                <tr>
                    <th>Student ID</th>
                    <th>Student Name</th>
                    <th>Date</th>
                    <th>Status</th>
                </tr>
            </thead>

            <tbody id="reportTableBody">
                <tr>
                    <td colspan="4">Select filters to generate report</td>
                </tr>
            </tbody>
        </table>

    </div>

    <script src="js/teacher-reports.js"></script>
</body>
</html>
