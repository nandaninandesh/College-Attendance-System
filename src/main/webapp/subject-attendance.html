
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subject-wise Attendance</title>
    <link rel="stylesheet" href="css/subject-attendance.css">
</head>
<body>

    <div class="container">

        <h1>Subject-wise Attendance</h1>
        <p>Check your attendance in each subject</p>

        <table>
            <thead>
                <tr>
                    <th>Subject</th>
                    <th>Total Classes</th>
                    <th>Present</th>
                    <th>Absent</th>
                    <th>Attendance Percentage</th>
                </tr>
            </thead>

            <tbody id="subjectAttendanceBody">
                <tr>
                    <td colspan="5">Loading attendance...</td>
                </tr>
            </tbody>
        </table>

    </div>

    <script src="js/subject-attendance.js"></script>

</body>
</html>
